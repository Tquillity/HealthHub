# pnpm 11 project settings (single-package repo; root is always in the workspace).
# See https://pnpm.io/settings#allowbuilds

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  sharp: true

# Supply-chain guard: only install package versions that have been public for at
# least 24 hours (pnpm 11 default). Most malicious npm releases are caught and
# pulled within hours. For an urgent security patch that is newer than this,
# add it to minimumReleaseAgeExclude instead of setting this to 0.
minimumReleaseAge: 1440
